# 混乱擢升 · 标题画面
#
# art 是字符画列表，从大到小排列；代码会挑选第一幅宽度放得进终端的画。
#   - 每幅画是一个 YAML 块字符串（`|-`）：换行分行，`---` 单独一行分帧。
#     数字 `2` 是缩进指示符：画里有以空格开头的行，必须显式声明内容缩进。
#   - 多帧会按 art_interval_ms 循环切换；行尾空格与画内空行都会保留。
#   - 宽度按终端单元格计算（全角字符占两格）。
#   - 终端更窄时，「简化画」（有某一行窄于该画最宽的一行）可以收紧边距。
#   - 连简化画都放不下时只显示 name，于是最小的终端只显示标题字符串。
# art_interval_ms 既是每帧的停留时间，也是相邻两幅画之间的切换间隔。
# menu 的键与动作按语言区分；default_language 决定找不到语言时的回退。
default_language: zh_CN
titles:
  zh_CN:
    name: 混乱擢升
    subtitle: 异界，地球
    prompt: ""
    art_interval_ms: 600
    menu:
      - key: n
        label: 新建世界
        action: new
      - key: c
        label: 继续世界
        action: continue
      - key: d
        label: 删除世界
        action: delete
      - key: a
        label: 档案
        action: archive
      - key: s
        label: 设置
        action: settings
      - key: q
        label: 退出
        action: quit
    art:
      - |-2
